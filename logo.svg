<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Chip body gradient -->
    <linearGradient id="chipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d"/>
      <stop offset="50%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <!-- Pin gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#888"/>
      <stop offset="50%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#888"/>
    </linearGradient>
    <!-- Pin gradient vertical -->
    <linearGradient id="pinGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#888"/>
      <stop offset="50%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#888"/>
    </linearGradient>
    <!-- Glow effect for text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Circuit trace pattern -->
    <pattern id="circuitPattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="none"/>
      <circle cx="0" cy="0" r="1.5" fill="#0a3d0a" opacity="0.3"/>
      <circle cx="20" cy="20" r="1.5" fill="#0a3d0a" opacity="0.3"/>
      <line x1="0" y1="0" x2="20" y2="20" stroke="#0a3d0a" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background (transparent for logo use) -->

  <!-- Circuit traces in background -->
  <g opacity="0.15">
    <line x1="50" y1="250" x2="90" y2="250" stroke="#00ff88" stroke-width="2"/>
    <line x1="90" y1="250" x2="90" y2="200" stroke="#00ff88" stroke-width="2"/>
    <circle cx="50" cy="250" r="4" fill="none" stroke="#00ff88" stroke-width="1.5"/>
    <circle cx="90" cy="200" r="3" fill="#00ff88"/>

    <line x1="350" y1="250" x2="310" y2="250" stroke="#00ff88" stroke-width="2"/>
    <line x1="310" y1="250" x2="310" y2="300" stroke="#00ff88" stroke-width="2"/>
    <circle cx="350" cy="250" r="4" fill="none" stroke="#00ff88" stroke-width="1.5"/>
    <circle cx="310" cy="300" r="3" fill="#00ff88"/>

    <line x1="200" y1="100" x2="200" y2="130" stroke="#00ff88" stroke-width="1.5"/>
    <circle cx="200" cy="100" r="3" fill="#00ff88"/>
    <line x1="200" y1="400" x2="200" y2="370" stroke="#00ff88" stroke-width="1.5"/>
    <circle cx="200" cy="400" r="3" fill="#00ff88"/>
  </g>

  <!-- DIP-40 Chip Body -->
  <rect x="100" y="120" width="200" height="260" rx="8" ry="8" fill="url(#chipBody)" stroke="#444" stroke-width="2"/>

  <!-- Chip notch (pin 1 indicator) -->
  <circle cx="200" cy="135" r="10" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="200" cy="135" r="6" fill="#111" stroke="#666" stroke-width="1"/>

  <!-- Left side pins (20 pins) -->
  <g>
    <rect x="75" y="140" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="155" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="170" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="185" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="200" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="215" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="230" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="245" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="260" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="275" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="290" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="305" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="320" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="335" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="350" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="75" y="365" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
  </g>

  <!-- Right side pins (20 pins) -->
  <g>
    <rect x="300" y="140" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="155" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="170" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="185" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="200" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="215" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="230" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="245" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="260" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="275" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="290" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="305" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="320" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="335" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="350" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
    <rect x="300" y="365" width="25" height="6" rx="1" fill="url(#pinGradV)" stroke="#666" stroke-width="0.5"/>
  </g>

  <!-- Chip surface texture -->
  <rect x="105" y="125" width="190" height="250" rx="5" ry="5" fill="url(#circuitPattern)" opacity="0.5"/>

  <!-- Chip label area -->
  <rect x="115" y="150" width="170" height="210" rx="3" ry="3" fill="none" stroke="#333" stroke-width="1"/>

  <!-- Chip marking text -->
  <!-- Manufacturer mark (top) -->
  <text x="200" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#888" font-weight="bold">КР580ВМ80А</text>

  <!-- Separator line -->
  <line x1="125" y1="180" x2="275" y2="180" stroke="#444" stroke-width="1"/>

  <!-- Main project name on chip -->
  <text x="200" y="210" text-anchor="middle" font-family="monospace" font-size="22" fill="#00e676" font-weight="bold" filter="url(#glow)">8080-5</text>
  <text x="200" y="235" text-anchor="middle" font-family="monospace" font-size="18" fill="#00e676" font-weight="bold" filter="url(#glow)">C I</text>

  <!-- Separator -->
  <line x1="125" y1="248" x2="275" y2="248" stroke="#444" stroke-width="0.5"/>

  <!-- Subtitle on chip -->
  <text x="200" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa">Control Interface</text>
  <text x="200" y="282" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888">Intel 8080 Emulator</text>

  <!-- Additional chip markings (bottom) -->
  <line x1="125" y1="295" x2="275" y2="295" stroke="#444" stroke-width="0.5"/>
  <text x="200" y="312" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">i8080 · MCP · PySide6</text>
  <text x="200" y="330" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">DIP-40 · 8-bit · 256 instr</text>
  <text x="200" y="345" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">SLIP · TOML · SSE</text>

  <!-- Pin 1 dot on chip -->
  <circle cx="125" cy="145" r="5" fill="#222" stroke="#555" stroke-width="0.5"/>

  <!-- Title below chip -->
  <text x="200" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e0e0e0" font-weight="bold">i8080-5 CI</text>
  <text x="200" y="440" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#999">i8080-5 Control Interface</text>

  <!-- Tagline -->
  <text x="200" y="465" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">Мастер-контроллер для платформы i8080-5</text>
  <text x="200" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">Master Controller for i8080-5 Platform</text>

  <!-- Decorative corner brackets -->
  <g stroke="#00e676" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 30,30 L 30,15 L 45,15"/>
    <path d="M 355,15 L 370,15 L 370,30"/>
    <path d="M 370,470 L 370,485 L 355,485"/>
    <path d="M 45,485 L 30,485 L 30,470"/>
  </g>
</svg>
